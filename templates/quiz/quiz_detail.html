{% extends "base.html" %}

{% block title %}
{{ quiz.title }}
{% endblock %}

{% block content %}

<h1>{{ quiz.title }}</h1>
<p>{{ quiz.description }}</p>
<p>Duration: {{ quiz.duration_minutes }} minutes</p>
<p>Total Questions: {{ quiz.total_questions }}</p>
<form method="post" action="{% url 'quiz:start' quiz.pk %}">
    {% csrf_token %}
    <button type="submit">
        Start Quiz
    </button>
</form>

{% endblock %}
